# Quickstart example (original, fictional scenario): a city library deciding where to fund e-book onboarding.
# Used by `deckctl.py smoke` and the installer to prove a fresh install can validate, compile, and render.
schema_version: '1.0'
deck_meta:
  deck_id: quickstart-library-ebooks
  context_brief_ref: artifacts/context_brief.md
  storyline_ref: artifacts/storyline.md
  workflow_mode: greenfield
  delivery_mode: standalone
  target_format: pptx
  deck_language: en
  language_rule_card: LANG-EN
  aspect_ratio: '16:9'
  design_system: editorial
  colour_kit: blue
  theme_palette:
    background_hex: '#FFFFFF'
    text_primary_hex: '#1F2937'
    text_muted_hex: '#6B7280'
    panel_highlight_bg_hex: '#F3F4F6'
    greyscale_baseline:
      context_series_hex: '#9E9E9E'
      context_line_width_pt: 1.5
      axis_and_grid_hex: '#D1D5DB'
      zero_competing_dark_series_verified: true
    two_tier_accent:
      primary_focal_hex: '#2B5C8F'
      primary_focal_line_width_pt: 3.25
      secondary_tint_hex: '#9FC4EE'
      shaded_delta_fill_hex: '#DCE8F4'
      single_hue_hierarchy_verified: true
    colorblind_safe_verified: true
slides:
- slide_id: slide_01
  slide_number: 1
  arc_stage: rising_action
  analytical_question: When did e-books become the library’s main way of lending?
  target_stakeholder: Library board
  layout_spec:
    layout_type: one_sided_right_text
    upper_left_z_anchor: true
    grid_alignment_verified: true
  word_jobs:
    takeaway_title:
      text: E-book loans overtook print loans in 2023.
      token_count: 7
      sentence_case_verified: true
      active_verb_verified: true
      color_tie_spans:
      - substring: E-book loans
        color_hex: '#2B5C8F'
        bold: true
        linked_series_or_category: E-book loans
    no_triple_headline_repetition_verified: true
    chart_title: Annual loans (thousands) by format, 2019–2025 actuals and 2026 forecast
    axis_titles:
      x_axis_title: Year
      y_axis_title: Loans (thousands)
    direct_labels_mode: series_endpoints
    annotations:
    - text: E-book loans grew from 40k to 205k while print fell from 180k to 119k.
      target_panel_id: panel_loans
      anchor_data_point: '2025'
      color_tie_spans:
      - substring: 40k to 205k
        color_hex: '#2B5C8F'
        bold: true
        linked_series_or_category: E-book loans
    recommendation_callout:
      text: Plan 2026 collection spend around digital demand, not shelf space.
      distinct_from_takeaway_title: true
      color_tie_spans: []
    source_footnote: 'Source: Library circulation system, annual loan totals 2019–2025; 2026 is the library’s own forecast.'
  visual_spec:
    render_mode: native_editable_chart
    g3_tradeoff_record:
      selected_option_summary: Two-line chart of e-book and print loans
      shows: The 2023 crossover and the widening gap afterwards.
      obscures: Loans by branch (shown on the next slide).
      rejected_alternatives:
      - Stacked bars of total loans (hides the crossover)
    declutter_rules:
      outer_chart_border: false
      minor_gridlines: false
      axis_tick_marks: false
      detached_legend: false
      attached_data_table: false
      strip_trailing_decimal_zeros: true
      actual_vs_forecast_line_encoding: solid_actual_dashed_forecast
    scale_guardrails:
      shared_y_axis: true
    panels:
    - panel_id: panel_loans
      panel_role: primary_single
      chart_family: line_chart
      panel_chart_title: E-book vs. print loans (thousands)
      x_axis:
        categories: ['2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026F']
        show_labels: true
      y_axis:
        min: 0
        max: 250
        number_format: '0'
        show_subtle_gridlines: true
      series:
      - series_name: Print loans
        visual_role: context_greyscale
        color_hex: '#9E9E9E'
        line_width_pt: 1.5
        direct_label_placement: right_endpoint
        data_points:
        - {category: '2019', value: 180, formatted_label: 180k, is_forecast: false, source_cell_ref: library_loans.csv!R2C3}
        - {category: '2020', value: 110, formatted_label: 110k, is_forecast: false, source_cell_ref: library_loans.csv!R3C3}
        - {category: '2021', value: 140, formatted_label: 140k, is_forecast: false, source_cell_ref: library_loans.csv!R4C3}
        - {category: '2022', value: 135, formatted_label: 135k, is_forecast: false, source_cell_ref: library_loans.csv!R5C3}
        - {category: '2023', value: 130, formatted_label: 130k, is_forecast: false, source_cell_ref: library_loans.csv!R6C3}
        - {category: '2024', value: 124, formatted_label: 124k, is_forecast: false, source_cell_ref: library_loans.csv!R7C3}
        - {category: '2025', value: 119, formatted_label: 119k, is_forecast: false, source_cell_ref: library_loans.csv!R8C3}
      - series_name: E-book loans
        visual_role: focal_primary_tier1
        color_hex: '#2B5C8F'
        line_width_pt: 3.25
        direct_label_placement: right_endpoint
        data_points:
        - {category: '2019', value: 40, formatted_label: 40k, is_forecast: false, source_cell_ref: library_loans.csv!R2C2}
        - {category: '2020', value: 95, formatted_label: 95k, is_forecast: false, source_cell_ref: library_loans.csv!R3C2}
        - {category: '2021', value: 110, formatted_label: 110k, is_forecast: false, source_cell_ref: library_loans.csv!R4C2}
        - {category: '2022', value: 125, formatted_label: 125k, is_forecast: false, source_cell_ref: library_loans.csv!R5C2}
        - {category: '2023', value: 150, formatted_label: 150k, is_forecast: false, source_cell_ref: library_loans.csv!R6C2}
        - {category: '2024', value: 178, formatted_label: 178k, is_forecast: false, source_cell_ref: library_loans.csv!R7C2}
        - {category: '2025', value: 205, formatted_label: 205k, is_forecast: false, source_cell_ref: library_loans.csv!R8C2}
        - {category: '2026F', value: 228, formatted_label: 228k, is_forecast: true, source_cell_ref: library_loans.csv!R9C2}
  claim_evidence_contract:
    claimed_construct_in_title: E-book loans exceeding print loans from 2023
    plotted_metric_on_chart: Annual loans (thousands) by format
    strict_claim_match_verified: true
    numeric_source_traceability_verified: true
    rendered_png_qa:
      rendered_image_path: renders/slide_01.png
      zero_text_overlap_or_clipping: true
      compound_word_linebreak_safe: true
- slide_id: slide_02
  slide_number: 2
  arc_stage: resolution
  analytical_question: Which branches lag on e-book adoption?
  target_stakeholder: Library board
  layout_spec:
    layout_type: one_sided_right_text
    upper_left_z_anchor: true
    grid_alignment_verified: true
  word_jobs:
    takeaway_title:
      text: Old Town and Northgate lag far behind on e-book adoption.
      token_count: 10
      sentence_case_verified: true
      active_verb_verified: true
      color_tie_spans:
      - substring: Old Town and Northgate
        color_hex: '#2B5C8F'
        bold: true
        linked_series_or_category: Old Town, Northgate
    no_triple_headline_repetition_verified: true
    chart_title: Share of 2025 loans that were e-books, by branch (%)
    axis_titles:
      x_axis_title: Branch
      y_axis_title: E-book share of loans (%)
    direct_labels_mode: bar_values
    annotations:
    - text: Old Town (27%) and Northgate (24%) sit at about half the share of the other three branches.
      target_panel_id: panel_branches
      anchor_data_point: Northgate
      color_tie_spans:
      - substring: about half the share
        color_hex: '#2B5C8F'
        bold: true
        linked_series_or_category: Old Town, Northgate
    recommendation_callout:
      text: Fund e-reader lending and onboarding sessions at Old Town and Northgate first.
      distinct_from_takeaway_title: true
      color_tie_spans: []
    source_footnote: 'Source: Library circulation system, 2025 loans by branch and format.'
  visual_spec:
    render_mode: native_editable_chart
    g3_tradeoff_record:
      selected_option_summary: Ranked horizontal bars of e-book share by branch
      shows: The two lagging branches at a glance.
      obscures: Absolute loan volumes per branch.
      rejected_alternatives:
      - Pie chart per branch (hard to compare)
    declutter_rules:
      outer_chart_border: false
      minor_gridlines: false
      axis_tick_marks: false
      detached_legend: false
      attached_data_table: false
      strip_trailing_decimal_zeros: true
      actual_vs_forecast_line_encoding: solid_actual_dashed_forecast
    scale_guardrails:
      shared_y_axis: true
    panels:
    - panel_id: panel_branches
      panel_role: primary_single
      chart_family: horizontal_bar_chart
      panel_chart_title: Branches ranked by e-book share
      x_axis:
        categories: [Central, Riverside, Hillcrest, Old Town, Northgate]
        show_labels: true
      y_axis:
        min: 0
        max: 70
        number_format: '0'
        show_subtle_gridlines: false
      series:
      - series_name: E-book share
        visual_role: context_greyscale
        color_hex: '#9E9E9E'
        line_width_pt: 1.5
        direct_label_placement: bar_end
        data_points:
        - {category: Central, value: 58, formatted_label: 58%, is_forecast: false, source_cell_ref: branch_ebook_share.csv!R2C2}
        - {category: Riverside, value: 54, formatted_label: 54%, is_forecast: false, source_cell_ref: branch_ebook_share.csv!R3C2}
        - {category: Hillcrest, value: 49, formatted_label: 49%, is_forecast: false, source_cell_ref: branch_ebook_share.csv!R4C2}
        - {category: Old Town, value: 27, formatted_label: 27%, is_forecast: false, point_visual_role_override: focal_primary_tier1, point_color_override_hex: '#2B5C8F', source_cell_ref: branch_ebook_share.csv!R5C2}
        - {category: Northgate, value: 24, formatted_label: 24%, is_forecast: false, point_visual_role_override: focal_primary_tier1, point_color_override_hex: '#2B5C8F', source_cell_ref: branch_ebook_share.csv!R6C2}
  claim_evidence_contract:
    claimed_construct_in_title: Old Town and Northgate lag on e-book adoption
    plotted_metric_on_chart: E-book share of 2025 loans by branch (%)
    strict_claim_match_verified: true
    numeric_source_traceability_verified: true
    rendered_png_qa:
      rendered_image_path: renders/slide_02.png
      zero_text_overlap_or_clipping: true
      compound_word_linebreak_safe: true
g4_review_audit:
  status: agent_review_complete
  checklist_results:
    G4_1_no_triple_headline_repetition: pass
    G4_2_dual_title_upper_left_z_anchor: pass
    G4_3_distinct_seven_word_jobs: pass
    G4_4_subtraction_first_decluttering: pass
    G4_5_greyscale_baseline_no_competing_dark: pass
    G4_6_accessible_palette_and_color_tie: pass
    G4_7_small_multiples_scale_integrity: pass
    G4_8_strict_claim_vs_evidence_match: pass
    G4_9_hundred_percent_numeric_traceability: pass
    G4_10_rendered_png_geometry_inspection: pass
    G4_11_delivery_mode_fidelity: pass
    G4_12_stakeholder_stress_test_complete: pass
  skeptic_stress_test_qa:
  - skeptic_name_or_role: Library board treasurer
    predicted_question: Is the e-book rise just a pandemic effect that will fade?
    evidence_backed_response: Slide 1 shows e-book loans kept climbing every year after 2020, from 95k to 205k by 2025.
    supporting_slide_numbers: [1]
  - skeptic_name_or_role: Old Town branch manager
    predicted_question: Do our patrons simply prefer print?
    evidence_backed_response: Slide 2 shows the gap is branch-specific; onboarding support is the cheapest way to test whether access, not preference, drives it.
    supporting_slide_numbers: [2]
