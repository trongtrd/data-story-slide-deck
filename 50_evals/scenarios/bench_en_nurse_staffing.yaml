    question: What decision do we need today?
    stakeholder: Grace Adeyemi (CEO) and the Executive Leadership Team
    chart_title: Decision requested and first three steps
    rec:
      text: 'Approve unit-based staffing from next quarter (fallback: a six-month pilot in Critical Care and Emergency).'
