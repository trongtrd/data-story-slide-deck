    steps:
      - {title: 'Step 1: Home units', description: Assign every nurse a home unit; new graduates stay put for two years.}
      - {title: 'Step 2: Planned cross-training', description: Two scheduled cross-unit shifts per quarter for experienced nurses.}
      - {title: 'Step 3: Track the savings', description: Report agency spend and first-year turnover monthly against the $4.3M target.}
    footnote: 'Source: Northvale nursing workforce review, FY2026.'
    claim: {construct: approval of unit-based staffing, metric: Decision request (no chart)}
