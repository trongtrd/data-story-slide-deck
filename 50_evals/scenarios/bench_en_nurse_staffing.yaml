          - {name: New graduate, role: focal, labels: both_endpoints, label: '{v:.0f}%', base: {dataset: nurse_outcomes, where: {metric: first_year_turnover_pct, unit_type: Emergency, cohort: New graduate}}, points: {'2023': {column: before_rotation}, '2025': {column: current}}}
