          - {name: Experienced, role: context, labels: none, base: {dataset: nurse_outcomes, where: {metric: competency_score, unit_type: Emergency, cohort: Experienced}}, points: {'2023': {column: before_rotation}, '2025': {column: current}}}
          - {name: New graduate, role: focal, labels: both_endpoints, label: '{v:.1f}', base: {dataset: nurse_outcomes, where: {metric: competency_score, unit_type: Emergency, cohort: New graduate}}, points: {'2023': {column: before_rotation}, '2025': {column: current}}}
