          - {name: New graduate, role: focal, labels: both_endpoints, label: '{v:.1f}', base: {dataset: nurse_outcomes, where: {metric: competency_score, unit_type: Critical Care, cohort: New graduate}}, points: {'2023': {column: before_rotation}, '2025': {column: current}}}
      - id: panel_ed
        role: small_multiple_cell
        grid_pos: [1, 2]
