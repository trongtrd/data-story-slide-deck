    question: What would unit-based staffing save each year?
    stakeholder: Tomás Reyes (CFO)
    chart_title: Modeled annual savings from unit-based staffing ($M)
    labels_mode: bar_values
    annotations:
      - {text: $2.6M comes from fewer agency nurses and $1.7M from replacing fewer leavers., tie: [fewer agency nurses], anchor: Unit-based staffing}
    rec: {text: Book the agency savings in the FY2026 nursing budget.}
    footnote: 'Source: Northvale finance model of unit-based staffing, FY2026.'
    g3: {selected: Single stacked column with a total label, shows: The two savings components and their sum., obscures: Monthly phasing of savings., rejected: [Waterfall from current to proposed cost]}
    claim: {construct: annual savings of unit-based staffing, metric: Modeled annual savings ($M)}
