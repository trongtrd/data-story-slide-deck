    slide_numbers: [4]
    human_or_operational_peak: 52,4% hợp tác xã dưới 20 thành viên báo giảm doanh thu.
    financial_or_strategic_peak: Chỉ 18,3% dự định mở rộng sản xuất năm 2027.
  opening_summary:
    enabled: true
    reason: Buổi chia sẻ dạng hybrid, không có phản đối; hội viên đọc trước nên cần câu trả lời ngay trang đầu.
  sections:
    - {number: 1, claim: Giá phân bón và giá bán cùng ép biên lợi nhuận., slides: [2]}
    - {number: 2, claim: Hợp tác xã nhỏ chịu sức ép doanh thu nặng nhất., slides: [3]}
    - {number: 3, claim: Phần lớn hợp tác xã chưa vội mở rộng năm 2027., slides: [4, 5]}

qa:
  - skeptic_name_or_role: Hội viên nhóm trên 50 thành viên
    predicted_question: Vì sao nhóm lớn có tỷ lệ giảm doanh thu thấp hơn hẳn?
    evidence_backed_response: Nhóm này có 18 hợp tác xã trả lời, ít hơn nhiều so với hai nhóm còn lại; dòng nguồn của slide 3 nêu cỡ mẫu từng nhóm.
    supporting_slide_numbers: [3]
  - skeptic_name_or_role: Ông Quang (Chủ tịch hiệp hội)
    predicted_question: Có thể dùng các tỷ lệ khó khăn để xếp hạng mức độ nghiêm trọng không?
    evidence_backed_response: Có thể so sánh mức độ phổ biến, vì mỗi hợp tác xã chọn tối đa hai khó khăn; slide 2 cho thấy giá phân bón được chọn nhiều nhất.
    supporting_slide_numbers: [2]

