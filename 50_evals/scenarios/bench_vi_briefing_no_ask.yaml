  tension: Chi phí đầu vào tăng đúng lúc giá bán giảm, nên hợp tác xã chọn đứng yên thay vì mở rộng.
  withheld: 5
  pruned:
    - {item: Cách chọn mẫu và tỷ lệ phản hồi theo tỉnh, disposition: speaker_notes, reason: Hội viên không cần để đọc kết quả; trả lời khi được hỏi.}
