    pass1: Giá phân bón tăng và giá bán giảm cùng lúc, nên phần lớn hợp tác xã giữ nguyên kế hoạch sản xuất năm 2027 thay vì mở rộng.
    question: Khảo sát hội viên năm 2026 cho thấy điều gì?
