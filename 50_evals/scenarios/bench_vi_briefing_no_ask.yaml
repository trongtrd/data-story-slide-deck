# D-035 benchmark (fictional, Vietnamese): a members' briefing with no ask and no resistance.
# Exercises: resistance_assessment none_identified, reading notes, implication callouts (no method caveats on
# cards, D-058), two-entity Color Tie, a conclusion close, and an appendix diverging
# stacked bar of an answer scale (D-057 B9).
run_id: bench_vi_briefing_no_ask
example_card: EX-004
deck: {language: vi, delivery_mode: hybrid, palette: blue}
title_slide: {title: Kết quả khảo sát hội viên Sông Xanh năm 2026, audience_line: Buổi chia sẻ với hội viên hiệp hội, date: Tháng 11/2026, presenter: Nhóm nghiên cứu của hiệp hội}

context:
  org: Hiệp hội Hợp tác xã Nông sản Sông Xanh (hư cấu)
  room: Buổi chia sẻ kết quả khảo sát hội viên năm 2026
  decision_maker:
    name_or_role: Ông Quang (Chủ tịch hiệp hội, chủ trì buổi chia sẻ)
    decision_authority: Chốt cách đọc chung kết quả khảo sát trước phần thảo luận chính sách
    core_priority: Hội viên hiểu đúng và giống nhau về tình hình năm 2026
  allies:
    - name_or_role: Nhóm nghiên cứu của hiệp hội
      priority: Trình bày kết quả trung thực và dễ hiểu
      evidence_needed: Tỷ lệ theo từng khó khăn, theo quy mô và kế hoạch năm 2027
  resistance_assessment: none_identified
  resistance_reason: Buổi chia sẻ kết quả cho hội viên; không có đề xuất hay quyết định nào bị tranh chấp.
  primary_action: Thống nhất cách đọc chung kết quả khảo sát năm 2026 để làm nền cho phần thảo luận chính sách.
  fallback: Ghi nhận các điểm hội viên cần làm rõ để bổ sung trong báo cáo đầy đủ.
  benefits:
    - Phần thảo luận chính sách bắt đầu từ cùng một bức tranh về chi phí, giá bán và kế hoạch năm 2027.
    - Hội viên nhóm nhỏ thấy rõ mức độ khó khăn của mình so với nhóm lớn.
  risks:
    - Mỗi nhóm đọc số liệu theo một cách và thảo luận lệch hướng.
    - Tỷ lệ của nhóm lớn bị diễn giải quá mức dù cỡ mẫu nhỏ.
  big_idea:
    sentence: Hợp tác xã đang chịu sức ép kép từ giá phân bón và giá bán nên phần lớn giữ nguyên kế hoạch năm 2027, và đó là nền chung cho thảo luận chính sách.
    point_of_view: Hợp tác xã đang chịu sức ép kép từ giá phân bón và giá bán
    stakes_clause: phần lớn giữ nguyên kế hoạch năm 2027
    phrasing_mode: directional
    phrasing_rationale: Buổi chia sẻ cần hướng đọc chung trước; số liệu chi tiết nằm ở từng slide.

report: |
  # Hiệp hội Hợp tác xã Nông sản Sông Xanh — Khảo sát hội viên năm 2026 (dữ liệu hư cấu cho benchmark)

  - 240 hợp tác xã trả lời; mỗi hợp tác xã chọn tối đa hai khó khăn lớn nhất.
  - Giá phân bón tăng: 64,2%; giá bán nông sản giảm: 47,5%; thiếu lao động thời vụ: 31,7%; khó tiếp cận vốn: 22,9%.
  - Tỷ lệ báo giảm doanh thu: 52,4% ở nhóm dưới 20 thành viên (126 hợp tác xã), 41,0% ở nhóm 20–50 (96), 27,8% ở nhóm trên 50 (18).
  - Kế hoạch sản xuất năm 2027: mở rộng 18,3%, giữ nguyên 49,6%, thu hẹp 14,2%, chưa quyết định 17,9%.
  - Kỳ vọng năm 2027 so với năm 2026 (xấu hơn nhiều / xấu hơn / như năm nay / tốt hơn / tốt hơn nhiều): nhóm dưới 20 thành viên 14,3 / 27,8 / 31,0 / 21,4 / 5,6%; nhóm 20–50: 9,4 / 21,9 / 33,3 / 27,1 / 8,3%; nhóm trên 50: 5,6 / 16,7 / 27,8 / 33,3 / 16,7%.

