    title: Mint Chill and Hazelnut Cloud fell the most among seasonal drinks.
    tie: [Mint Chill and Hazelnut Cloud]
    pass1: Ranking every drink by its change in sales shows that two seasonal drinks, Mint Chill and Hazelnut Cloud, declined far more than any other item.
    question: Which drinks are behind the seasonal decline?
    stakeholder: Sofia Marin (Head of Menu Innovation)
