storyline:
  arc_model: story_mountain
  tension: The menu's seasonal drinks are shrinking while stores run short of baristas — two separate leaks in same-store sales.
  withheld: 4
  pruned:
    - {item: Store-by-store weather adjustment model, disposition: excluded, reason: Explains noise that does not change the decision.}
    - {item: Full ingredient cost breakdown per drink, disposition: excluded, reason: Margin detail the menu team receives as a separate cost sheet after the meeting.}
  climax:
    slide_numbers: [2, 3]
    human_or_operational_peak: Stores will be 22 baristas short of plan by December.
    financial_or_strategic_peak: Mint Chill and Hazelnut Cloud lost 18% and 14% of sales.
  skeptic_slides:
    - {slide_number: 3, target_skeptic: Amara Diallo (Regional Operations Director), objection_neutralized: 'The gap sits in one role, so hiring can be targeted.'}
    - {slide_number: 4, target_skeptic: Kenji Watanabe (CFO), objection_neutralized: Filling the gap recovers $1.5M of sales.}

