slides:
  - arc: plot
    layout: one_sided_right_text
    title: Seasonal drinks fell while core drinks kept growing.
    tie: [Seasonal drinks fell]
    pass1: Looking at FY2025 sales by menu segment, the seasonal drinks declined on average while the core menu continued to grow.
    question: How did core and seasonal drinks perform this year?
    stakeholder: Owen Byrne (COO)
    chart_title: Average year-over-year sales change (%) by menu segment, FY2025
    labels_mode: bar_values
    annotations:
      - {text: Core drinks averaged +9.4% while seasonal drinks averaged -7.8%., tie: [seasonal drinks averaged -7.8%], anchor: Seasonal drinks (5)}
    rec: {text: Look inside the seasonal lineup before cutting it wholesale.}
    footnote: 'Source: Copperleaf point-of-sale data, FY2025 vs. FY2024 (140 stores).'
    g3: {selected: Two-bar column chart of segment averages, shows: The direction of each segment., obscures: Item-level spread (next slide)., rejected: [Table of ten items]}
    claim: {construct: seasonal decline vs. core growth, metric: Average YoY sales change (%) by segment}
    panels:
      - id: panel_segments
        family: vertical_bar_chart
        title: Two menu segments
        categories: [Core drinks (5), Seasonal drinks (5)]
        y: [-10, 15]
        format: 0%
        series:
          - name: Average change
            role: context
            labels: bar_end
            label: '{s}{a:.1f}%'
            base: {dataset: menu_yoy, column: yoy_sales_change_pct}
            highlight: {Seasonal drinks (5): focal}
            points:
              Core drinks (5): {where: [{item: Espresso Tonic}, {item: Iced Matcha}, {item: Classic Americano}, {item: Flat White}, {item: Chai Latte}], aggregation: mean}
              Seasonal drinks (5): {where: [{item: Honey Lavender Latte}, {item: Maple Oat Latte}, {item: Cocoa Crunch Frappé}, {item: Hazelnut Cloud Mocha}, {item: Mint Chill Cold Brew}], aggregation: mean}

  - arc: climax
