        title: Middle East & Africa
        categories: ["'20", "'21", "'22", "'23", "'24", "'25F", "'26F"]
        y: [0, 40]
        format: $0M
        series:
          - {name: Harbor, role: context, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Middle East & Africa}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
          - {name: Skyline, role: focal, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline, region: Middle East & Africa}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}

  - arc: resolution
    layout: one_sided_left_text
    title: Move $12M from Harbor to Skyline to add $95M by 2026.
    tie: [add $95M by 2026]
    pass1: We recommend moving twelve million dollars of renewal budget from Harbor to Skyline adoption, which the model says adds ninety-five million by 2026.
    question: What should we do with the FY2025 sales budget?
    stakeholder: Ruth Feldman (CFO) and Ines Carvalho (CRO)
    chart_title: Budget moved and added Skyline revenue ($M)
    labels_mode: bar_values
    annotations:
      - {text: 'The $12M comes from Harbor renewal budget, so operating expense stays flat.', tie: [operating expense stays flat]}
    rec:
      header: DECISION REQUESTED TODAY
      text: 'Approve the $12M move for Europe and Asia Pacific (fallback: $6M in Europe first, the rest after the Q2 review).'
    footnote: 'Source: Kestrel FY2025 budget model and Skyline revenue forecast.'
    g3: {selected: Horizontal bars of budget moved vs. added revenue, shows: Return relative to the amount moved., obscures: Timing within each year., rejected: [Multi-row budget table]}
    claim: {construct: $95M added by 2026 from a $12M move, metric: Budget moved and modeled added revenue ($M)}
    panels:
      - id: panel_return
        family: horizontal_bar_chart
        title: Return on the shift
        categories: [Budget moved (FY2025), Added revenue (2025F), Added revenue (2026F)]
        y: [-40, 100]
        format: $0M
