        role: hero_total_left
        family: line_chart
        title: Total ($M)
        categories: ["'20", "'21", "'22", "'23", "'24", "'25F", "'26F"]
        y: [0, 600]
        format: $0M
        deltas: [{upper_series_name: Skyline, lower_series_name: Harbor, start_category: "'25F", end_category: "'26F", label_text: "+$198M Skyline lead ('26F)"}]
        series:
          - {name: Harbor, role: context, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}, sum_over: {region: [Americas, Europe, Asia Pacific, Middle East & Africa]}}
          - {name: Skyline, role: focal, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}, sum_over: {region: [Americas, Europe, Asia Pacific, Middle East & Africa]}}
      - &region_panel
        id: panel_am
        role: small_multiple_cell
        family: line_chart
        title: Americas
        show_x: false
        categories: ["'20", "'21", "'22", "'23", "'24", "'25F", "'26F"]
        y: [0, 300]
        format: $0M
        series:
          - {name: Harbor, role: context, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Americas}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
          - {name: Skyline, role: focal, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline, region: Americas}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
      - id: panel_eu
        role: small_multiple_cell
        family: line_chart
        title: Europe
        shaded: true
        show_x: false
        categories: ["'20", "'21", "'22", "'23", "'24", "'25F", "'26F"]
        y: [0, 160]
        format: $0M
        series:
          - {name: Harbor, role: context, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Europe}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
          - {name: Skyline, role: focal, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline, region: Europe}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
      - id: panel_ap
