storyline:
  tension: Renewal budget stays locked on Harbor while Skyline overtakes it — exactly where Harbor is shrinking fastest.
  withheld: 3
  pruned:
    - {item: Country-level reseller inventory tables, disposition: speaker_notes, reason: Obscures the four-region picture; answered if asked.}
    - {item: Product telemetry adoption funnels, disposition: excluded, reason: Engineering detail unrelated to the budget split.}
  climax:
    slide_numbers: [3]
    human_or_operational_peak: Harbor falls fastest in Europe ($123M to $88M) and Asia Pacific ($67M to $50M).
    financial_or_strategic_peak: Skyline overtakes Harbor in 2025F and leads by $198M in 2026F.
  skeptic_slides:
    - {slide_number: 2, target_skeptic: 'Daniel Okoro (EVP, Europe & Asia Pacific)', objection_neutralized: Harbor is already falling fastest in his regions despite current spend.}
    - {slide_number: 4, target_skeptic: Ruth Feldman (CFO), objection_neutralized: The $12M comes from Harbor renewal budget; opex stays flat.}

qa:
  - skeptic_name_or_role: Daniel Okoro (EVP, Europe & Asia Pacific)
    predicted_question: Won’t cutting renewal support speed up Harbor’s decline in my regions?
    evidence_backed_response: Slide 2 shows Harbor falling 28% in Europe and 25% in Asia Pacific at current spend; Slide 3 shows Skyline more than replacing it.
    supporting_slide_numbers: [2, 3]
  - skeptic_name_or_role: Ruth Feldman (CFO)
    predicted_question: Does this need new operating expense?
    evidence_backed_response: No. Slide 4 moves $12M from Harbor renewals and models $40M (2025F) and $95M (2026F) of added Skyline revenue.
    supporting_slide_numbers: [4]

slides:
  - arc: plot
    layout: one_sided_right_text
    title: Revenue growth now depends on Skyline cloud subscriptions.
    tie: [Skyline cloud subscriptions]
    pass1: Over the past five years almost all of our revenue growth has come from Skyline cloud subscriptions rather than Harbor licences.
    question: Where has revenue growth come from since 2020?
    stakeholder: Ines Carvalho (CRO)
    chart_title: Annual revenue by product ($M), 2020–2024 actuals
    labels_mode: bar_values
    annotations:
      - {text: Skyline grew from $60M to $345M while Harbor stayed near $435M., tie: [$60M to $345M], anchor: '2024'}
    rec: {text: 'Plan FY2025 budgets around Skyline growth, not Harbor renewals.'}
    footnote: 'Source: Kestrel finance ledger, 2020–2024.'
    g3: {selected: Stacked columns with totals, shows: Total growth and Skyline’s rising share., obscures: Regional detail (next slides)., rejected: [Pie chart of 2024 mix]}
    claim: {construct: revenue growth from Skyline, metric: Annual revenue by product ($M)}
    panels:
      - id: panel_mix
        family: stacked_bar_chart
        title: Harbor and Skyline revenue
        categories: ['2020', '2021', '2022', '2023', '2024']
        y: [0, 800]
        format: $0M
        stack_total_labels: [$440M, $515M, $600M, $690M, $780M]
        series:
          # Skyline first: the focal segment sits on the baseline (D-057 B5)
          - {name: Skyline, role: focal, labels: bar_end, label: '${v:.0f}M', base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024]}, sum_over: {region: [Americas, Europe, Asia Pacific, Middle East & Africa]}}
          - {name: Harbor, role: context, labels: bar_end, label: '${v:.0f}M', base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024]}, sum_over: {region: [Americas, Europe, Asia Pacific, Middle East & Africa]}}

  - arc: rising_action
    layout: one_sided_right_text
    title: Harbor licences have peaked and fall fastest in Europe and Asia Pacific.
    tie: [Europe, {text: Asia Pacific, color: tier2}]
    pass1: When we compare each region's 2023 Harbor revenue with the 2026 forecast, Europe and Asia Pacific decline the most.
    question: Where is Harbor declining fastest?
    stakeholder: Daniel Okoro (EVP, Europe & Asia Pacific)
    chart_title: Harbor revenue by region ($M), 2023 peak vs. 2026 forecast
    annotations:
      - {text: Europe falls 28% ($123M to $88M) and Asia Pacific 25% ($67M to $50M)., tie: [Europe falls 28%], anchor: '2026F'}
    rec: {text: Stop adding renewal effort where Harbor customers are already moving to the cloud.}
    footnote: 'Source: Kestrel regional forecast, 2023 actuals and 2026 forecast.'
    g3: {selected: Slopegraph of 2023 vs. 2026F by region, shows: Rate of decline per region., obscures: Year-by-year path (next slide)., rejected: [Eight-line spaghetti chart]}
    claim: {construct: Harbor peak and fastest decline in Europe and Asia Pacific, metric: Harbor revenue by region ($M)}
    panels:
      - id: panel_harbor_regions
        family: slopegraph
        title: Four regions
        categories: [2023 peak, 2026F]
        y: [0, 250]
        format: $0M
        series:
          - {name: Americas, role: context, labels: both_endpoints, label: '${v:.0f}M', forecast: [2026F], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Americas}}, category_key: {column: year, values: [2023, 2026]}}
          - {name: Middle East & Africa, direct_label_name: MEA, role: context, labels: both_endpoints, label: '${v:.0f}M', forecast: [2026F], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Middle East & Africa}}, category_key: {column: year, values: [2023, 2026]}}
          - {name: Asia Pacific, role: tier2, labels: both_endpoints, label: '${v:.0f}M', forecast: [2026F], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Asia Pacific}}, category_key: {column: year, values: [2023, 2026]}}
          - {name: Europe, role: focal, labels: both_endpoints, label: '${v:.0f}M', forecast: [2026F], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Europe}}, category_key: {column: year, values: [2023, 2026]}}

  - arc: climax
    layout: 1_plus_4_grid
    title: Skyline growth is expected to more than offset Harbor’s decline.
    tie: [Skyline growth]
    pass1: Looking at the total and all four regions together, Skyline’s growth is forecast to more than make up for Harbor’s decline.
    question: Will Skyline offset Harbor through 2026, overall and in each region?
    stakeholder: Portfolio Committee
    chart_title: Revenue ($M) by product, total and by region, 2020–2024 actuals (solid) and 2025–2026 forecast (dashed)
    scale:
      shared_y_axis: false
      non_uniform_scale_justification: Regional revenue differs by more than 4x (Americas vs. Middle East & Africa).
      non_uniform_axis_label_mode: min_max_only
      require_direct_endpoint_labels: true
    annotations:
      - {text: Skyline overtakes Harbor in 2025F ($450M vs. $405M) and leads by $198M in 2026F., tie: [leads by $198M in 2026F]}
    rec: {text: Shift field support toward Skyline in Europe and Asia Pacific.}
    footnote: 'Source: Kestrel global and regional forecast, 2020–2026. Regional panels use their own scales.'
    g3: {selected: 1+4 grid of line charts, shows: The global crossover plus each region on its own scale., obscures: Exact cross-region comparisons (different scales)., rejected: [Ten-line single chart]}
    claim: {construct: Skyline growth offsetting Harbor decline, metric: 'Revenue by product ($M), actuals and forecast'}
    reveal:
