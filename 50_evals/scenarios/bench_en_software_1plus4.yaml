        y: [0, 100]
        format: $0M
        series:
          - {name: Harbor, role: context, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Harbor, region: Asia Pacific}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
          - {name: Skyline, role: focal, label: '${v:.0f}M', forecast: ["'25F", "'26F"], base: {dataset: revenue, column: revenue_usd_m, where: {product: Skyline, region: Asia Pacific}}, category_key: {column: year, values: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}}
      - id: panel_mea
