- slide_id: slide_04
  slide_number: 4
  arc_stage: resolution
  analytical_question: What should we do with the FY2025 sales budget?
  target_stakeholder: Ruth Feldman (CFO) and Ines Carvalho (CRO)
  layout_spec:
    layout_type: one_sided_left_text
    upper_left_z_anchor: true
    grid_alignment_verified: true
  word_jobs:
    takeaway_title:
      text: Move $12M from Harbor to Skyline to add $95M by 2026.
      token_count: 11
      sentence_case_verified: true
      active_verb_verified: true
      color_tie_spans:
      - substring: add $95M by 2026
        color_hex: '#2B5C8F'
        linked_series_or_category: focal series
    no_triple_headline_repetition_verified: true
    chart_title: Budget moved and added Skyline revenue ($M)
    direct_labels_mode: bar_values
    annotations:
    - text: The $12M comes from Harbor renewal budget, so operating expense stays flat.
      target_panel_id: panel_return
      anchor_data_point: '-'
      color_tie_spans:
      - substring: operating expense stays flat
        color_hex: '#2B5C8F'
        linked_series_or_category: focal series
        bold: true
    recommendation_callout:
      text: 'Approve the $12M move for Europe and Asia Pacific (fallback: $6M in Europe first, the rest after the Q2 review).'
      distinct_from_takeaway_title: true
      color_tie_spans: []
      header_label: DECISION REQUESTED TODAY
    source_footnote: 'Source: Kestrel FY2025 budget model and Skyline revenue forecast.'
  visual_spec:
    render_mode: native_editable_chart
    g3_tradeoff_record:
      selected_option_summary: Horizontal bars of budget moved vs. added revenue
      shows: Return relative to the amount moved.
      obscures: Timing within each year.
      rejected_alternatives:
      - Multi-row budget table
    declutter_rules:
      outer_chart_border: false
      minor_gridlines: false
      axis_tick_marks: false
      detached_legend: false
      attached_data_table: false
      strip_trailing_decimal_zeros: true
      actual_vs_forecast_line_encoding: solid_actual_dashed_forecast
    scale_guardrails:
      shared_y_axis: true
    panels:
    - panel_id: panel_return
      panel_role: primary_single
